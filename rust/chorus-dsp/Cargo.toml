[package]
name = "chorus-dsp"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rustfft = "6"
num-complex = "0.4"

[dev-dependencies]
approx = "0.5"
ndarray-npy = "0.8"
ndarray = "0.15"
hound = "3"

[[bin]]
name = "streaming_latency"
path = "src/bin/streaming_latency.rs"
